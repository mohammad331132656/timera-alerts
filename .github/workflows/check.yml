name: Timera hourly day alerts

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview without sending Telegram messages'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: timera-hourly
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Check Timera and notify channel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$DRY_RUN" = "true" ]; then
            python monitor.py --dry-run
          else
            python monitor.py
          fi
      - name: Persist announced days (even after partial delivery failure)
        if: always()
        run: |
          if [ -f .timera_state.json ] && [ -n "$(git status --porcelain -- .timera_state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .timera_state.json
            git commit -m "Save announced Timera days"
            git push
          fi
